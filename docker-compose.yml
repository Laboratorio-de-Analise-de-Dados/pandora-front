services:
  frontend:
    image: paulomoro/pandora-front:latest
    container_name: pandora_frontend
    ports:
      - "8084:8080"
      - "444:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /srv/pandora/certbot/conf:/etc/letsencrypt
    networks:
      - pandora_net

networks:
  pandora_net:
    driver: bridge
    external: true
