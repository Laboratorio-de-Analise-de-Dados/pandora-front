name: 🚀 Deploy Pandora Frontend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            echo "🔑 Fazendo login no Docker Hub..."
            echo ${{ secrets.DOCKER_TOKEN }} | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin

            echo "📥 Puxando imagem mais recente..."
            docker pull ${{ secrets.DOCKER_USER }}/pandora-front:${{ github.sha }}


            echo "🧹 Removendo container antigo (se existir)..."
            docker rm -f pandora_frontend || true

            echo "⚙️ Subindo novo container..."
            docker run -d \
              --name pandora_frontend \
              --restart always \
              --network pandora_net \
              --expose 80 \
              ${{ secrets.DOCKER_USER }}/pandora-front:${{ github.sha }}



            echo "✅ Deploy concluído!"
