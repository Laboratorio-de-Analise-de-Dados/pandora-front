name: ↩️ Rollback Pandora Frontend

# Redeploya uma tag já publicada (PRD FE-30). Uso: Actions -> Rollback ->
# Run workflow -> informar a tag (ex.: v1.2.0). Cobre o caso "deploy
# passou no health check mas a UI veio errada".
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da imagem a restaurar (ex.: v1.2.0)"
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production # mesmo portão manual do deploy
    steps:
      - name: Redeploy da tag ${{ inputs.tag }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          IMAGE_TAG: ${{ inputs.tag }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DOCKER_USER,DOCKER_TOKEN,IMAGE_TAG
          script: |
            set -e
            cd /opt/pandora/frontend

            echo "🔑 Login no Docker Hub..."
            echo "$DOCKER_TOKEN" | docker login -u "$DOCKER_USER" --password-stdin

            echo "↩️  Restaurando $IMAGE_TAG..."
            export DOCKER_USER IMAGE_TAG
            docker compose -f docker-compose.prod.yml pull frontend
            docker compose -f docker-compose.prod.yml up -d frontend

            echo "$IMAGE_TAG" > .deployed_version
            echo "✅ Rollback para $IMAGE_TAG concluído."
